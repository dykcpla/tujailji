(function () {

  var META = { fromCache: false, hasPendingWrites: false };
  function snap(col) {

      var d = store[p]; return { id: p.split('/')[1], exists: true, data: function () { return d; }, metadata: META };

    },

        set: function (d) { store[p] = JSON.parse(JSON.stringify(d)); persist(); emitSoon(p.split('/')[0]); return Promise.resolve(); },
        delete: function () { delete store[p]; persist(); emitSoon(p.split('/')[0]); return Promise.resolve(); },

  }

    callTool: function (server, tool, input) {

  /* --- 영상용 가족사진: 드라이브 「영상사진」 폴더 → 이 기기에만 저장(IndexedDB) --- */

  var photoP = null;
  window.__photos = function (onFresh) {

      // 앱을 열 때마다 목록(이름·수정시각)만 가볍게 확인하고, 달라졌을 때만 사진을 다시 받음
      var sigOf = function (l) { return l.map(function (p) { return p.name + p.modified; }).sort().join('|'); };
      if (cfg()) api('photos=list').then(function (j) {

      }).then(function (j) {

  };

  /* --- 앱에서 바꾼 값을 엑셀 칸에 저장 (앱스 스크립트 w=1) --- */

    return api('w=1&id=' + encodeURIComponent(fileId) + '&s=' + encodeURIComponent(sheet) + '&cells=' + encodeURIComponent(JSON.stringify(cells))).then(function (j) {
      if (!j || !j.ok) throw { code: 'old_script', message: '앱스 스크립트를 새 코드로 바꿔야 엑셀에 저장할 수 있습니다' };
      return j;
    }, function (e) {

  /* --- 연결 설정 화면 --- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function showSetup() {
    var c = cfg() || {};

      '<div class="field"><label for="pwaK">접근 키</label><input id="pwaK" value="' + esc(c.k || '') + '" autocomplete="off"></div>' +
      '<p class="small" id="pwaMsg" role="status"></p><div style="display:flex;gap:8px"><button class="btn pri" type="button" id="pwaGo" style="flex:1;justify-content:center;padding:12px">연결하기</button>' + (cfg() ? '<button class="btn" type="button" id="pwaX" style="justify-content:center;padding:12px">닫기</button>' : '') + '</div></div>';
    document.body.appendChild(el);

        setTimeout(function () { location.reload(); }, 600);
      }).catch(function (e) { if (old) setCfg(old); else localStorage.removeItem(CFG_KEY); msg.textContent = '연결하지 못했습니다: ' + (e && e.message ? e.message : '주소와 키를 확인해 주세요'); });

  };

<script>
/* ===== 계산 엔진: 엑셀 BOARD·월말일현황·자녀증여·PLAN 수식을 그대로 옮김 ===== */
var ENG = (function () {
  var DAY = 86400000;
  function serial(s) { if (!s) return null; var a = s.split('-'); return Date.UTC(+a[0], +a[1] - 1, +a[2]) / DAY; }
  function todayISO() { var n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); }
  function ymOf(s) { return s ? s.slice(0, 7) : null; }
  function rdown(x, d) { var f = Math.pow(10, d); return Math.floor(x * f + 1e-9) / f; }
  function sum(a, f) { var s = 0; for (var i = 0; i < a.length; i++) s += f ? (f(a[i]) || 0) : (a[i] || 0); return s; }
  function tkMap(st) { var m = {}; st.tickers.forEach(function (t) { m[t.t] = t; }); return m; }
  function isSell(r) { return r.k === 'S'; }
  function isClosed(r) { return !r.d || !!r.sd; } // 날짜 없는 요약행·전량매도행 = 보유 집계 제외
  function rowCost(r, tk) {
    if (r.krw != null) return r.krw;
    if ((r.c || (tk && tk.c)) === 'USD') return r.p * r.q * (r.fx != null ? r.fx : (tk && tk.fx) || 0);
    return r.p * r.q;
  }
  function ageAt(birth, iso) { return (serial(iso) - serial(birth)) / 365; }

  /* 실현손익 (엑셀 거래내역 O열) */
  function realized(st, trades, fxNow) {
    var tm = tkMap(st), out = [];
    // 1) 기존 방식: 매수행에 매도 정보를 적은 행
    trades.forEach(function (r) {
      if (isSell(r) || r.sd == null) return;
      var tk = tm[r.t], usd = (r.c || (tk && tk.c)) === 'USD';
      var cost = rowCost(r, tk) * (r.q ? r.sq / r.q : 1);
      var amt = r.sq * r.sp * (usd ? (r.sfx || fxNow) : 1);
      out.push({ id: r.id, t: r.t, d: r.sd, buyD: r.d, q: r.sq, p: r.sp, amt: amt, cost: cost, gain: amt - cost, usd: usd, days: r.d ? serial(r.sd) - serial(r.d) + 1 : null });
    });
    // 2) 앱에서 입력한 매도행: 평균단가 기준
    var byT = {};
    trades.forEach(function (r) { if (r.d && !r.sd) (byT[r.t] = byT[r.t] || []).push(r); });
    Object.keys(byT).forEach(function (t) {
      var rows = byT[t].slice().sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : (isSell(a) ? 1 : 0) - (isSell(b) ? 1 : 0); });
      if (!rows.some(isSell)) return;
      var tk = tm[t], usd = (tk ? tk.c : rows[0].c) === 'USD', q = 0, k = 0;
      rows.forEach(function (r) {
        if (!isSell(r)) { q += r.q; k += rowCost(r, tk); return; }
        var ratio = q > 0 ? Math.min(1, r.q / q) : 0, cost = k * ratio;
        var amt = r.q * r.p * (usd ? (r.sfx || fxNow) : 1);
        q -= r.q; k -= cost;
        out.push({ id: r.id, t: t, d: r.d, q: r.q, p: r.p, amt: amt, cost: cost, gain: amt - cost, usd: usd, sellRow: true });
      });
    });
    return out.sort(function (a, b) { return (b.d || '').localeCompare(a.d || ''); });
  }

  /* BOARD 계산 (SIM은 opt.prices/opt.fx 로 같은 함수 사용) */
  function board(st, trades, divRows, opt) {
    opt = opt || {};
    var fx = opt.fx != null ? opt.fx : st.fxNow;
    var today = serial(opt.today || todayISO());
    var tm = tkMap(st);
    var H = st.tickers.map(function (tk) {
      var price = opt.prices && opt.prices[tk.t] != null ? +opt.prices[tk.t] : +tk.price;
      var rows = trades.filter(function (r) { return r.t === tk.t && !isClosed(r); })
        .sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : (isSell(a) ? 1 : 0) - (isSell(b) ? 1 : 0); });
      var q = 0, u = 0, k = 0, wsum = 0, wk = 0, first = null;
      rows.forEach(function (r) {
        if (isSell(r)) {
          var ratio = q > 0 ? Math.min(1, r.q / q) : 0;
          q -= r.q; u -= u * ratio; k -= k * ratio; return;
        }
        var c = rowCost(r, tk), s = serial(r.d);
        q += r.q; u += tk.c === 'USD' ? r.p * r.q : 0; k += c;
        wsum += c * (today - s); wk += c; if (first === null || s < first) first = s;
      });
      var usd = tk.c === 'USD';
      var avg = q ? (usd ? rdown(u / q, 3) : k / q) : 0;
      var evalUsd = usd ? price * q : 0;
      var ev = usd ? price * q * fx : price * q;
      var months = wk ? wsum / wk / 30.4375 : 0;
      var firstM = first !== null ? (today - first) / 30.4375 : 0;
      var annual = k ? (months >= 12 ? Math.pow(ev / k, 12 / months) - 1 : ev / k - 1) : 0;
      var divRecv = sum(divRows.filter(function (d) { return d.t === tk.t; }), function (d) { return d.krw; });
      return {
        t: tk.t, c: tk.c, g: tk.g, acct: tk.acct, buyFx: tk.fx, price: price, qty: q, usdCost: u, cost: k, avg: avg,
        evalUsd: evalUsd, eval: ev, profit: ev - k, rate: k ? (ev - k) / k : 0,
        priceRate: usd && avg ? (price - avg) / avg : (avg ? (price - avg) / avg : 0),
        months: months, firstM: firstM, annual: annual,
        divEst: (tk.dy || 0) * ev * (1 - (tk.tax || 0)), divRecv: divRecv, divYoc: k ? divRecv / k : 0,
        fxGain: usd ? (fx - tk.fx) * avg * q : 0
      };
    });
    var cost = sum(H, function (h) { return h.cost; });
    var ev = sum(H, function (h) { return h.eval; });
    var cash = (+st.deposit || 0) + (+st.cashBal || 0);
    var bilKrw = fx * (+st.bilUsd || 0);
    var total = cash + ev + bilKrw;
    var divAll = sum(divRows, function (d) { return d.krw; });
    var rz = realized(st, trades, fx);
    var rzSum = sum(rz, function (r) { return r.gain; });
    var usdH = H.filter(function (h) { return h.c === 'USD'; });
    var usdCostSum = sum(usdH, function (h) { return h.usdCost; }) + (+st.bilUsd || 0);
    var avgFx = usdCostSum ? (sum(usdH, function (h) { return h.usdCost * h.buyFx; }) + st.bilFx * st.bilUsd) / usdCostSum : 0;
    var fxGain = sum(usdH, function (h) { return h.fxGain; }) + (fx - st.bilFx) * st.bilUsd;
    var groups = ['SPCX', 'NSD100', 'S&P500', 'SCHD', 'GOLD'].map(function (g) {
      var a = sum(H.filter(function (h) { return h.g === g; }), function (h) { return h.eval; });
      return { g: g, amt: a, w: total ? a / total : 0 };
    });
    groups.push({ g: 'CASH', amt: cash + bilKrw, w: total ? (cash + bilKrw) / total : 0 });
    var divEst = H.map(function (h) { return { t: h.t, dy: tm[h.t].dy || 0, tax: tm[h.t].tax || 0, amt: h.divEst }; }).filter(function (d) { return d.dy > 0; });
    divEst.push({ t: 'BIL', dy: st.bilDy || 0, tax: st.bilTax || 0, amt: (st.bilDy || 0) * bilKrw * (1 - (st.bilTax || 0)) });
    var divEstSum = sum(divEst, function (d) { return d.amt; });
    var profit = ev - cost;
    var totalGain = divAll + profit + rzSum;
    var allAnnual = cost ? ev / cost - 1 : 0; // 엑셀 AG11: 가중보유 공란 → 누적수익률
    return {
      fx: fx, holdings: H, cost: cost, eval: ev, profit: profit, rate: cost ? profit / cost : 0,
      cash: cash, deposit: +st.deposit || 0, cashBal: +st.cashBal || 0, bilUsd: +st.bilUsd || 0, bilKrw: bilKrw, total: total,
      divAll: divAll, divYield: cost ? divAll / cost : 0, realized: rz, realizedSum: rzSum,
      totalGain: totalGain, totalGainRate: cost ? totalGain / cost : 0, allAnnual: allAnnual,
      usdHeld: sum(usdH, function (h) { return h.evalUsd; }) + (+st.bilUsd || 0), avgFx: avgFx, fxGain: fxGain,
      groups: groups, divEst: divEst, divEstSum: divEstSum, firstAll: Math.max.apply(null, H.map(function (h) { return h.firstM; }).concat([0]))
    };
  }

  /* 월별 매수 (BOARD 13~64행) */
  function monthlyBuys(st, trades) {

function sheetKid(kind, ki, idx) {
  var K = S.kids, k = K.list[ki], arr = kind === 'dep' ? k.deps : k.buys, r = idx != null ? clone(arr[idx]) : (kind === 'dep' ? { d: today(), amt: 150000, m: '월정기' } : { d: today(), t: 'TIGER S&P500', p: '', q: '' });
  var tnames = Object.keys(K.priceMap || {});
  var body = kind === 'dep'
    ? '<div class="grid2"><div class="field"><label for="kd-d">일자</label><input id="kd-d" type="date" value="' + esc(r.d) + '"></div><div class="field"><label for="kd-a">금액</label><input id="kd-a" type="number" inputmode="numeric" value="' + r.amt + '"></div></div><div class="field"><label for="kd-m">비고</label><input id="kd-m" value="' + esc(r.m || '') + '"></div>'
    : '<div class="grid2"><div class="field"><label for="kb-d">매수일</label><input id="kb-d" type="date" value="' + esc(r.d) + '"></div><div class="field"><label for="kb-t">종목</label><select id="kb-t">' + tnames.map(function (t) { return '<option' + (t === r.t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div><div class="field"><label for="kb-p">단가</label><input id="kb-p" type="number" inputmode="numeric" value="' + r.p + '"></div><div class="field"><label for="kb-q">수량</label><input id="kb-q" type="number" inputmode="numeric" value="' + r.q + '"></div></div>';
  openSheet(k.name + (kind === 'dep' ? ' 증여입금' : ' 매수'), body, '<button class="btn pri" type="button" id="kSave">저장</button>' + (idx != null ? '<button class="btn danger" type="button" id="kDel">삭제</button>' : ''), function () {
    $('#kSave').onclick = function () {
      var o = clone(S.kids), a = kind === 'dep' ? o.list[ki].deps : o.list[ki].buys;
      var row = kind === 'dep' ? { d: val('kd-d'), amt: n(val('kd-a')), m: val('kd-m') } : { d: val('kb-d'), t: val('kb-t'), p: n(val('kb-p')), q: n(val('kb-q')) };
      if (!row.d) return toast('날짜를 넣어 주세요.');
      if (idx != null) a[idx] = row; else a.push(row);
      a.sort(function (x, y) { return x.d.localeCompare(y.d); });
      S.kids = o; saveApp('kids'); closeSheet(); toast('저장했습니다.');
    };
    if ($('#kDel')) $('#kDel').onclick = function () { confirmIn('이 기록을 삭제할까요?', function () { var o = clone(S.kids); (kind === 'dep' ? o.list[ki].deps : o.list[ki].buys).splice(idx, 1); S.kids = o; saveApp('kids'); closeSheet(); }); };
  });
}

function sheetAddTicker() {
  var body = '<div class="grid2"><div class="field"><label for="nt-t">종목명 (거래내역과 똑같이)</label><input id="nt-t" placeholder="예: KODEX미국30년국채액티브(H)"></div><div class="field"><label for="nt-c">통화</label><select id="nt-c"><option value="KRW">원화</option><option value="USD">달러</option></select></div><div class="field"><label for="nt-g">자산군</label><select id="nt-g"><option>S&P500</option><option>NSD100</option><option>SCHD</option><option>GOLD</option><option>SPCX</option></select></div><div class="field"><label for="nt-a">계좌</label><select id="nt-a"><option>일반</option><option>해외직투</option><option>ISA</option><option>연금저축</option><option>IRP</option><option>금현물계좌</option></select></div><div class="field"><label for="nt-p">현재가</label><input id="nt-p" type="number" step="any"></div><div class="field"><label for="nt-fx">매수환율 (달러만)</label><input id="nt-fx" type="number" step="any"></div></div>';
  openSheet('종목 추가', body, '<button class="btn pri" type="button" id="ntSave">추가</button>', function () {
    $('#ntSave').onclick = function () {
      var t = val('nt-t').trim(); if (!t) return toast('종목명을 넣어 주세요.'); if (tk(t)) return toast('이미 있는 종목입니다.');
      var o = clone(S.settings), x = { t: t, c: val('nt-c'), g: val('nt-g'), acct: val('nt-a'), price: n(val('nt-p')), dy: 0, tax: 0, inBuy: true };
      if (x.c === 'USD') { x.fx = n(val('nt-fx')) || o.fxNow; x.tax = 0.15; }
      o.tickers.push(x); S.settings = o; saveApp('settings'); closeSheet(); toast(t + ' 종목을 추가했습니다.');
    };
  });
}

/* ---------- 내보내기 ---------- */
function stamp() { return today().replace(/-/g, ''); }
function saveFile(name, data) {
  if (!DL) { toast('이 화면에서는 파일 저장을 쓸 수 없습니다.'); return; }
  DL.save({ filename: name, data: data }).then(function () { toast('파일을 저장했습니다.'); }).catch(function (e) { if (!e || e.code !== 'declined') toast('파일을 저장하지 못했습니다.'); });
}
function exportJson() { saveFile('투자일지_백업_' + stamp() + '.json', JSON.stringify(exportObj(), null, 1)); }
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = window.__XLSX_URL || 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mini.min.js'; s.onload = function () { res(window.XLSX); }; s.onerror = rej; document.head.appendChild(s); });
}
function exportXlsx() {
  toast('엑셀 파일을 만드는 중입니다.');
  loadXLSX().then(function (X) {
    var C = ctx(), st = S.settings, wb = X.utils.book_new();
    var T = C.T.slice().sort(function (a, b) { return (a.d || '9').localeCompare(b.d || '9'); });
    var tr = [['순번', '거래일자', '종목', '단가', '수량', '합계(USD)', '누적환율', '원화환산', '비고', '매도일자', '매도량', '매도단가', '매도액', '보유기간', '차익', '수익율', '구분']];
    var rz = {}; C.B.realized.forEach(function (x) { rz[x.id] = x; });
    T.forEach(function (r, i) {
      var t = tk(r.t), cur = t ? t.c : (r.c || 'KRW'), sell = r.k === 'S', z = rz[r.id];
      var fx = cur === 'USD' ? (sell ? (r.sfx || st.fxNow) : (r.fx != null ? r.fx : (t && t.fx))) : '';
      tr.push([i + 1, r.d || '', r.t, r.p, r.q, cur === 'USD' ? r.p * r.q : '', fx, sell ? r.p * r.q * (fx || 1) : ENG.rowCost(r, t), r.m || '', r.sd || (sell ? r.d : ''), r.sd ? r.sq : (sell ? r.q : ''), r.sd ? r.sp : (sell ? r.p : ''), z ? z.amt : '', z && z.days ? z.days : '', z ? z.gain : '', z && z.cost ? z.gain / z.cost : '', sell ? '매도' : '매수']);
    });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(tr), '거래내역');
    var bd = [['종목', '통화', '계좌', '보유수량', '평단', '현재가', '매수총액', '평가총액', '평가수익', '수익률', '연평균수익율', '가중보유(개월)', '세후배당 누적']];
    C.B.holdings.forEach(function (x) { bd.push([x.t, x.c, x.acct, x.qty, x.avg, x.price, x.cost, x.eval, x.profit, x.rate, x.annual, x.months, x.divRecv]); });
    bd.push([], ['총금융자산', C.B.total], ['현금계', C.B.cash], ['채권(BIL) 평가액', C.B.bilKrw], ['총 수익', C.B.totalGain], ['현재환율', C.B.fx], ['시세 기준일', st.priceAt]);
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(bd), 'BOARD');
    var me = [['연월', '이슈', '평균환율', '매수액', '총자산', '총자산변동', '증감율', '주식', '현금+채권', '비고']];
    C.M.rows.forEach(function (r) { me.push([r.ym, r.issue || '', r.fx, r.buy, r.total, r.chg == null ? '' : r.chg, r.chgRate == null ? '' : r.chgRate, r.stock, r.cash, (r.live ? '(진행중) ' : '') + (r.memo || '')]); });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(me), '월말일현황');
    var dv = [['연월', '종목', 'USD(세후)', 'KRW(세후)']]; S.dividend.rows.forEach(function (r) { dv.push([r.ym, r.t, r.usd || '', r.krw]); });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(dv), '배당');
    var kd = [['자녀', '구분', '일자', '종목/비고', '단가', '수량', '금액']];
    S.kids.list.forEach(function (k) { k.deps.forEach(function (d) { kd.push([k.name, '증여입금', d.d, d.m, '', '', d.amt]); }); k.buys.forEach(function (b) { kd.push([k.name, '매수', b.d, b.t, b.p, b.q, b.p * b.q]); }); });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(kd), '자녀증여');
    var out = X.write(wb, { bookType: 'xlsx', type: 'array' });
    saveFile('투자일지_' + stamp() + '.xlsx', new Uint8Array(out));
  }).catch(function () { toast('엑셀 도구를 불러오지 못했습니다.'); });
}
function isRO() { return localGet('edit') !== '1'; }
function importExcel(el) {
  var f = el.files && el.files[0]; if (!f) return; el.value = '';
  toast('엑셀 파일을 읽는 중입니다.');
  Promise.all([loadXLSX(), f.arrayBuffer()]).then(function (res) {
    var o;
    try { o = XIMP.parse(res[0], new Uint8Array(res[1]), S); } catch (e) { toast('엑셀을 읽지 못했습니다. ' + (e && e.message ? e.message : '')); return; }
    var B = ENG.board(o.settings, o.trades, o.dividend.rows, {});
    var diff = o.check.total != null ? Math.abs(B.total - o.check.total) : 0;
    o.settings.importedAt = new Date().toISOString(); o.settings.importFile = f.name;
    var body = '<div class="preview">파일: ' + esc(f.name) + '<br>엑셀 기준일(BOARD 오늘 날짜): <b>' + esc(o.settings.priceAt || '-') + '</b><br>거래 ' + o.trades.length + '건 · 월말 기록 ' + o.monthend.rows.length + '개월 · 배당 ' + o.dividend.rows.length + '건</div>' +
      '<div class="kv" style="margin-top:0"><div><span>총금융자산(프로그램 계산)</span><span><b>' + won(B.total) + '</b></span></div><div><span>엑셀 BOARD 총금융자산</span><span>' + (o.check.total != null ? won(o.check.total) : '-') + '</span></div></div>' +
      (diff > 1000 ? '<p class="small" style="color:var(--warn);margin:0">두 금액이 ' + won(diff) + ' 차이 납니다. 엑셀을 저장한 뒤 다시 불러와 보세요.</p>' : '<p class="small muted" style="margin:0">두 금액이 일치합니다.</p>') +
      '<p class="small" style="margin:0">불러오면 프로그램의 데이터가 이 엑셀 내용으로 모두 바뀝니다.</p>';
    openSheet('엑셀 데이터 불러오기', body, '<button class="btn pri" type="button" id="xiYes">불러오기</button>', function () {
      $('#xiYes').onclick = function () { closeSheet(); toast('저장하는 중입니다.'); importAll(o).then(function () { toast('엑셀 데이터를 불러왔습니다.'); }); };
    });
  }).catch(function () { toast('엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); });
}
function importFile(el) {
  var f = el.files && el.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var o; try { o = JSON.parse(rd.result); } catch (e) { toast('JSON 파일을 읽지 못했습니다.'); return; }
    if (!o.settings || !(o.ledger || o.trades)) { toast('투자일지 백업 파일이 아닙니다.'); return; }
    var cnt = o.ledger ? Object.keys(o.ledger).reduce(function (s, k) { return s + (o.ledger[k].rows || []).length; }, 0) : o.trades.length;
    openSheet('백업 불러오기', '<div class="preview">거래 ' + cnt + '건, 월말 기록 ' + ((o.monthend || {}).rows || []).length + '건이 들어 있습니다.</div><p class="small">불러오면 지금 저장된 데이터를 모두 이 파일 내용으로 바꿉니다.</p>', '<button class="btn pri" type="button" id="imYes">불러오기</button>', function () {
      $('#imYes').onclick = function () { closeSheet(); importAll(o).then(function () { toast('불러왔습니다.'); }); };
    });
  };
  rd.readAsText(f); el.value = '';
}

/* ---------- 클릭 처리 ---------- */
document.addEventListener('click', function (e) {
  var g = e.target.closest('[data-go]');
  if (g) { location.hash = g.dataset.go; return; }
  var a = e.target.closest('[data-act]'); if (!a) return;
  var act = a.dataset.act;
  if (act === 'closeSheet') { if (a.classList.contains('scrim') && e.target !== a) return; closeSheet(); return; }
  if (act === 'detail') { if (ready()) sheetDetail(a.dataset.k, a.dataset.g); return; }
  if (act === 'firstSync') { S.mode = 'importing'; render(); driveSync(true, true); return; }
  if (!ready()) return;
  if (isRO() && EDIT_ACTS.indexOf(act) >= 0) return;
  switch (act) {
    case 'prices': sheetPrices(); break;
    case 'addTrade': sheetTrade(null, a.dataset.t); break;
    case 'editTrade': sheetTrade(a.dataset.id); break;
    case 'tf': UI.tf = a.dataset.v; UI.months = 3; rerender(); break;
    case 'filterT': UI.tf = a.dataset.t; UI.months = 3; UIV++; location.hash = 'trades'; break;
    case 'moreMonths': UI.months += 3; rerender(); break;
    case 'toggleHold': UI.openHold[a.dataset.t] = !UI.openHold[a.dataset.t]; rerender(); break;
    case 'toggleMonth': UI.openMonths[a.dataset.ym] = !UI.openMonths[a.dataset.ym]; rerender(); break;
    case 'closeMonth': sheetMonth(ctx().M.cur); break;
    case 'editMonth': sheetMonth(a.dataset.ym); break;
    case 'addMilestone': (function () { var o = clone(S.monthend); var ms = o.milestones = o.milestones || []; var last = ms[ms.length - 1]; var nx = last ? parseInt(last.label, 10) + 1 : 1; ms.push({ label: nx + '억', date: null }); S.monthend = o; saveApp('monthend'); })(); break;
    case 'addDiv': sheetDiv(null); break;
    case 'editDiv': sheetDiv(+a.dataset.i); break;
    case 'addKidDep': sheetKid('dep', +a.dataset.k, null); break;
    case 'addKidBuy': sheetKid('buy', +a.dataset.k, null); break;
    case 'editKidDep': sheetKid('dep', +a.dataset.k, +a.dataset.i); break;
    case 'editKidBuy': sheetKid('buy', +a.dataset.k, +a.dataset.i); break;
    case 'simReset': (function () { var o = clone(S.sim); o.fxNow = S.settings.fxNow; o.prices = {}; S.settings.tickers.forEach(function (t) { o.prices[t.t] = t.price; }); S.sim = o; saveApp('sim'); })(); break;
    case 'addTicker': sheetAddTicker(); break;
    case 'delTicker': (function () { var i = +a.dataset.i, t = S.settings.tickers[i]; openSheet('종목 집계 제외', '<p>' + esc(t.t) + '을(를) BOARD 집계에서 뺍니다. 거래내역은 그대로 남습니다.</p>', '<button class="btn pri" type="button" id="dtYes">빼기</button>', function () { $('#dtYes').onclick = function () { var o = clone(S.settings); o.tickers.splice(i, 1); S.settings = o; saveApp('settings'); closeSheet(); }; }); })(); break;
    case 'exportJson': exportJson(); break;
    case 'exportXlsx': exportXlsx(); break;
    case 'editMode': localSet('edit', a.dataset.v); rerender(); break;
    case 'syncNow': driveSync(true); break;
    case 'tgStep': (function () { var f = a.dataset.f; tgSet(f, tgGet(f) + (+a.dataset.d)); var inp = a.parentNode.querySelector('input'); if (inp) inp.value = tgFmt(f); tgUpdate(); })(); break;
    case 'tgReset': UI.tg = null; tgDraft(); UIV++; render(); break;
    case 'tgSave': tgSave(); break;
    case 'mvRate': try { localStorage.setItem('tj.mvRate', a.dataset.r); } catch (e) {} (function () { var r = document.getElementById('mvRoot'); if (r) { delete r.dataset.on; MV.user = false; mvMount(); } })(); break;
    case 'theme': localSet('theme', a.dataset.v); applyTheme(); rerender(); break;
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });

applyTheme();
renderTabs();
initData();
})();

</script>
